# XcodeGen spec for the Stepquest iOS app.
#   brew install xcodegen && cd ios && xcodegen generate && open Stepquest.xcodeproj
# The generated Stepquest.xcodeproj is not checked in.
name: Stepquest

options:
  bundleIdPrefix: app.stepquest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team here or in Xcode (Signing & Capabilities). HealthKit and
    # Sign in with Apple need a real team to run on device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  StepquestKit:
    path: StepquestKit

targets:
  Stepquest:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Stepquest
    dependencies:
      - package: StepquestKit
        product: StepquestKit
      - sdk: HealthKit.framework
      - sdk: CoreMotion.framework
      - sdk: SpriteKit.framework
      - sdk: AuthenticationServices.framework
    entitlements:
      path: Stepquest/Stepquest.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin:
          - Default
    info:
      path: Stepquest/Info.plist
      properties:
        CFBundleDisplayName: Stepquest
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - healthkit
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        NSHealthShareUsageDescription: >-
          Stepquest reads your step count and flights climbed so your real walking powers your hero,
          breaks Step Gates and counts toward leaderboards. Manually entered steps are ignored.
        NSMotionUsageDescription: >-
          Stepquest uses live motion data in Stride Mode to measure your walking cadence, which sets
          your hero's attack strength while you walk.
        # Background App Refresh: periodic step sync + idle catch-up. HealthKit background
        # delivery (HKObserverQuery) needs the entitlement above, not a background mode.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - app.stepquest.ios.refresh
        NSAppTransportSecurity:
          # Allows http://localhost:8787 (wrangler dev) and LAN IPs in development.
          NSAllowsLocalNetworking: true
        # Read by AppConfig; overridable at runtime in Settings (DEBUG builds).
        StepquestAPIBaseURL: $(STEPQUEST_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stepquest.ios
        PRODUCT_NAME: Stepquest
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          STEPQUEST_API_BASE_URL: "http://localhost:8787"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          STEPQUEST_API_BASE_URL: "https://api.stepquest.app"

  StepquestTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StepquestTests
    dependencies:
      - target: Stepquest
      - package: StepquestKit
        product: StepquestKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stepquest.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Stepquest:
    build:
      targets:
        Stepquest: all
        StepquestTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StepquestTests
        - package: StepquestKit/StepquestKitTests
    profile:
      config: Release
    archive:
      config: Release
